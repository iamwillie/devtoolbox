/* Nexus visual system + dark-mode readability overrides */
:root{
  --bg:#04060b;--panel:rgba(12,18,28,.74);--panel2:rgba(18,27,42,.82);--panel3:rgba(7,11,18,.78);
  --text:#f5f8ff;--muted:#8a96a8;--faint:#667389;--border:rgba(255,255,255,.11);
  --accent:#56f5e4;--accent2:#769aff;--accent3:#b786ff;--success:#56f5a8;--warn:#ffc66d;--danger:#ff6b7a;
  --shadow:0 18px 60px rgba(0,0,0,.24);--radius:18px;
}
[data-theme="light"]{
  --bg:#edf3f7;--panel:rgba(255,255,255,.86);--panel2:rgba(255,255,255,.72);--panel3:rgba(255,255,255,.92);
  --text:#111827;--muted:#5f6d7d;--faint:#7a8796;--border:rgba(15,23,42,.11);
  --accent:#0e9f9d;--accent2:#4f6df5;--accent3:#8b5cf6;--success:#059669;--warn:#b45309;--danger:#dc2626;
  --shadow:0 18px 50px rgba(15,23,42,.10)
}
html{background:var(--bg)}
body{
  color:var(--text);
  background:
    radial-gradient(circle at 28% 4%,rgba(118,154,255,.12),transparent 34rem),
    radial-gradient(circle at 95% 0%,rgba(86,245,228,.10),transparent 30rem),var(--bg);
}
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.18;
  background-image:radial-gradient(circle,rgba(130,210,255,.55) .7px,transparent .85px);
  background-size:28px 28px;mask-image:linear-gradient(to bottom,#000,transparent 85%)
}
[data-theme="light"] body:after{opacity:.08;background-image:radial-gradient(circle,rgba(79,109,245,.35) .7px,transparent .85px)}
.app{grid-template-columns:280px 1fr}
.sidebar{

}

}

.tool-card,.home-tool{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.065),rgba(255,255,255,.018));border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}

.match{background:rgba(86,245,228,.20);color:var(--text)}.claim-key,.capture code{color:var(--accent)}
.dual{gap:14px}.swap{color:var(--accent);font-family:var(--mono);display:grid;place-items:center}
.qr-box{border-radius:13px;padding:14px;box-shadow:0 14px 32px rgba(0,0,0,.22)}
.range-val{color:var(--muted)}
.home-grid{gap:14px}.home-tool{padding:15px;min-height:108px;border-radius:16px;text-align:left;position:relative;transition:.18s ease}.home-tool:hover{border-color:rgba(86,245,228,.30);transform:translateY(-2px);box-shadow:var(--shadow)}
.home-tool .title{font-weight:500;font-size:13px}.home-tool .desc{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:5px}
.section-label{font-family:var(--mono);font-size:9.5px;letter-spacing:1.2px;color:var(--muted);font-weight:400;margin:22px 0 11px;text-transform:uppercase}
.palette{background:rgba(0,0,0,.60);backdrop-filter:blur(8px)}
.palette-panel{background:rgba(12,18,28,.92);border:1px solid var(--border);border-radius:18px;box-shadow:0 28px 80px rgba(0,0,0,.40);backdrop-filter:blur(20px)}
[data-theme="light"] .palette-panel{background:rgba(255,255,255,.94);box-shadow:0 28px 80px rgba(15,23,42,.16)}
.palette-input{background:transparent;color:var(--text);height:58px;font-family:var(--mono);font-size:12px}
.palette-item{color:var(--text);border-radius:11px}.palette-item:hover,.palette-item.selected{background:rgba(86,245,228,.07)}
.toast{background:rgba(12,18,28,.94);border:1px solid var(--border);border-radius:12px;color:var(--text);box-shadow:var(--shadow);backdrop-filter:blur(18px)}
[data-theme="light"] .toast{background:rgba(255,255,255,.96)}
.mobile-menu{font-family:var(--mono)}
@media(max-width:950px){.content{padding-left:20px;padding-right:20px}.app{grid-template-columns:240px 1fr}}
@media(max-width:620px){.content{padding:20px 14px 44px}.topbar{padding:0 14px}.tool-card{border-radius:18px}.tool-body{padding:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}


/* Readability + theme switch refinements */
.home-tool{color:var(--text);}
.home-tool .title{color:var(--text);font-size:14px;line-height:1.35;}
.home-tool .desc{font-size:12px;line-height:1.5;color:var(--muted);}
.section-label{font-size:10.5px;color:var(--text);letter-spacing:1.35px;font-weight:500;}
.side-title{font-size:10px;color:var(--text);opacity:.78;}
.nav-item{font-size:13px;}
.nav-label{color:inherit;}
.tool-head h2{font-size:1.12rem;color:var(--text);}
.tool-head p{font-size:.86rem;color:var(--muted);}
.hero p{font-size:14px;}
.tag{font-size:10px;}
.field label{font-size:10px;color:var(--text);opacity:.82;}
.status{font-size:12px;}
.note,.alert{font-size:12.5px;}
.table{font-size:13px;}
.table th{font-size:10px;}
.table td{font-size:13px;}
.palette-input{font-size:13px;}
.palette-item{font-size:13px;}
.palette-k{font-size:11px;}

.theme-toggle{display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 10px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.035);color:var(--text);font-family:var(--mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;transition:.18s ease;}
[data-theme="light"] .theme-toggle{background:rgba(255,255,255,.58);}
.theme-toggle:hover{border-color:rgba(86,245,228,.35);background:rgba(86,245,228,.075);}
.theme-toggle-track{position:relative;width:44px;height:24px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid var(--border);box-shadow:inset 0 0 12px rgba(0,0,0,.18);flex:none;}
.theme-toggle-thumb{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px rgba(86,245,228,.42);transition:transform .2s ease,background .2s ease;}
.theme-toggle[aria-checked="true"] .theme-toggle-thumb{transform:translateX(20px);background:var(--accent2);box-shadow:0 0 12px rgba(118,154,255,.34);}
.theme-toggle-label{min-width:34px;text-align:left;}
@media(max-width:820px){.theme-toggle{width:100%;justify-content:center;}.top-actions{width:auto;}}

<body data-theme="dark">
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-row"><div class="logo">D</div><div><div class="brand-title">DevToolbox</div><div class="brand-sub">Local-first developer utilities</div></div></div></div>
    <div class="side-scroll" id="sidebarNav"></div>
    <div class="side-foot"><div class="privacy-pill"><span class="dot"></span><span>Runs locally in your browser</span></div><button class="btn ghost" id="installBtn" hidden>Install app</button></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button>
      <button class="search-trigger" id="paletteBtn"><span>⌘/Ctrl + K</span><span>Search tools, actions, categories…</span><b>Ctrl K</b></button>
      <div class="top-actions"><button class="theme-toggle" id="themeBtn" type="button" role="switch" aria-checked="false" title="Toggle light and dark theme" aria-label="Toggle light and dark theme"><span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span><span class="theme-toggle-label" id="themeLabel">Dark</span></button></div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="palette" id="palette"><div class="palette-panel"><input class="palette-input" id="paletteInput" placeholder="Search tools or actions…" autocomplete="off"><div class="palette-list" id="paletteList"></div></div></div>
<div class="toast-stack" id="toasts"></div>
<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const state={theme:localStorage.getItem('dt_theme')||'dark',favs:JSON.parse(localStorage.getItem('dt_favs')||'[]'),recent:JSON.parse(localStorage.getItem('dt_recent')||'[]'),active:'home'};
const icons={json:'{}',jwt:'⌘',uuid:'◈',time:'◷',base64:'B6',url:'↗',regex:'.*',qr:'▦',text:'Aa',hash:'#'};
const tools=[
{id:'json',name:'JSON Formatter',desc:'Format, minify, validate, and copy JSON.',icon:icons.json,cat:'Data',keys:'json formatter pretty print minify validate',view:jsonView},
{id:'jwt',name:'JWT Decoder',desc:'Inspect header and claims locally.',icon:icons.jwt,cat:'Security',keys:'jwt token claims decode auth',view:jwtView},
{id:'uuid',name:'UUID Generator',desc:'Generate UUID v4 values in bulk.',icon:icons.uuid,cat:'Generators',keys:'uuid guid random v4 generator',view:uuidView},
{id:'time',name:'Unix Timestamp',desc:'Convert seconds or milliseconds to dates.',icon:icons.time,cat:'Conversion',keys:'unix timestamp epoch date time utc iso milliseconds seconds',view:timeView},
{id:'base64',name:'Base64',desc:'Encode or decode text without uploads.',icon:icons.base64,cat:'Encoding',keys:'base64 encode decode text binary',view:base64View},
{id:'url',name:'URL Parser',desc:'Inspect URL parts and query parameters.',icon:icons.url,cat:'Web',keys:'url uri parser query params encode decode percent',view:urlView},
{id:'regex',name:'Regex Tester',desc:'Test matches, flags, and capture groups.',icon:icons.regex,cat:'Text',keys:'regex regexp regular expression tester matches groups flags',view:regexView},
{id:'qr',name:'QR Generator',desc:'Create QR codes locally from text or URLs.',icon:icons.qr,cat:'Generators',keys:'qr qrcode barcode url text png svg error correction',view:qrView},
{id:'text',name:'Text Transformer',desc:'Case, whitespace, lines, sorting, dedupe.',icon:icons.text,cat:'Text',keys:'text transformer camel pascal snake kebab constant uppercase lowercase trim duplicate sort',view:textView},
{id:'hash',name:'Hash Generator',desc:'SHA-256/384/512 for text and files.',icon:icons.hash,cat:'Security',keys:'hash sha256 sha384 sha512 digest file crypto',view:hashView}
];
function persist(){localStorage.setItem('dt_theme',state.theme);localStorage.setItem('dt_favs',JSON.stringify(state.favs));localStorage.setItem('dt_recent',JSON.stringify(state.recent));}
function toast(msg,type='good'){const d=document.createElement('div');d.className='toast '+type;d.textContent=msg;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),2400)}
function copyText(text){navigator.clipboard?.writeText(text).then(()=>toast('Copied to clipboard')).catch(()=>toast('Copy failed; select and copy manually','bad'))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setTheme(){document.body.dataset.theme=state.theme;const b=$('#themeBtn');if(b){const light=state.theme==='light';b.setAttribute('aria-checked',String(light));$('#themeLabel').textContent=light?'Light':'Dark'}}
function touchRecent(id){state.recent=[id,...state.recent.filter(x=>x!==id)].slice(0,6);persist();renderSidebar()}
function toolById(id){return tools.find(t=>t.id===id)}
function navButton(t,active=false){return `<button class="nav-item ${active?'active':''}" data-nav="${t.id}"><span class="nav-icon">${t.icon}</span><span class="nav-label">${esc(t.name)}</span><span class="nav-star favorite ${state.favs.includes(t.id)?'on':''}" data-fav="${t.id}">★</span></button>`}
function renderSidebar(){const cats={};tools.forEach(t=>(cats[t.cat]??=[]).push(t));let html=`<div class="side-section"><div class="side-title">Workspace</div><button class="nav-item ${state.active==='home'?'active':''}" data-nav="home"><span class="nav-icon">⌂</span><span class="nav-label">All tools</span></button></div>`;
if(state.recent.length){html+=`<div class="side-section"><div class="side-title">Recently used</div>${state.recent.map(id=>navButton(toolById(id),state.active===id)).join('')}</div>`}
if(state.favs.length){html+=`<div class="side-section"><div class="side-title">Favourites</div>${state.favs.map(id=>navButton(toolById(id),state.active===id)).join('')}</div>`}
Object.keys(cats).sort().forEach(cat=>{html+=`<div class="side-section"><div class="side-title">${esc(cat)}</div>${cats[cat].map(t=>navButton(t,state.active===t.id)).join('')}</div>`});$('#sidebarNav').innerHTML=html;$$('[data-nav]').forEach(b=>b.addEventListener('click',e=>{if(e.target.closest('[data-fav]'))return;openView(b.dataset.nav);$('#sidebar').classList.remove('open')}));$$('[data-fav]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const id=b.dataset.fav;state.favs=state.favs.includes(id)?state.favs.filter(x=>x!==id):[...state.favs,id];persist();renderSidebar();renderActiveFavorite()}))}
function renderActiveFavorite(){const t=toolById(state.active);if(t){$$(`[data-fav="${t.id}"]`).forEach(x=>x.classList.toggle('on',state.favs.includes(t.id)))} }
function openView(id){state.active=id;if(id==='home'){renderHome();renderSidebar();return}const t=toolById(id);if(!t)return;touchRecent(id);$('#content').innerHTML=t.view();renderSidebar();wireGlobalTool(t.id)}
function toolShell(t,body){return `<div class="hero"><div><h1>${esc(t.name)}</h1><p>${esc(t.desc)}</p></div><div class="tag-row"><span class="tag">${esc(t.cat)}</span><button class="btn ghost" id="favoriteTool">★ ${state.favs.includes(t.id)?'Favourited':'Favourite'}</button></div></div><div class="tool-card"><div class="tool-head"><div class="tool-icon">${t.icon}</div><div><h2>${esc(t.name)}</h2><p>${esc(t.desc)}</p></div><div class="head-actions"></div></div><div class="tool-body">${body}</div></div>`}
function renderHome(){let recent=state.recent.map(toolById).filter(Boolean);$('#content').innerHTML=`<div class="hero"><div><h1>Developer utilities, in one place.</h1><p>Fast, local-first tools for everyday development work. Your inputs stay in this tab unless the browser itself needs an external platform service.</p></div><div class="tag-row"><span class="tag">10 tools</span><span class="tag">Client-side</span><span class="tag">Keyboard-first</span></div></div><div id="smartPaste" class="hidden"></div>${recent.length?`<div class="section-label">Recently used</div><div class="home-grid">${recent.map(homeCard).join('')}</div>`:''}<div class="section-label">All tools</div><div class="home-grid">${tools.map(homeCard).join('')}</div>`;$$('[data-open-tool]').forEach(b=>b.addEventListener('click',()=>openView(b.dataset.openTool)));}
function homeCard(t){return `<button class="home-tool" data-open-tool="${t.id}"><div class="tool-icon">${t.icon}</div><div><div class="title">${esc(t.name)}</div><div class="desc">${esc(t.desc)}</div></div></button>`}
function wireGlobalTool(id){const fav=$('#favoriteTool');if(fav)fav.onclick=()=>{state.favs=state.favs.includes(id)?state.favs.filter(x=>x!==id):[...state.favs,id];persist();renderSidebar();fav.textContent='★ '+(state.favs.includes(id)?'Favourited':'Favourite')};wireSmartPaste();}
function btn(id,label,cls='btn ghost'){return `<button class="${cls}" id="${id}">${label}</button>`}
function jsonView(){return toolShell(toolById('json'),`<div class="stack"><div class="dual"><div class="field"><label>Input</label><textarea id="jsonInput" spellcheck="false" placeholder='{"hello":"world","items":[1,2,3]}'></textarea></div><div class="swap">↔</div><div class="field"><label>Output</label><textarea id="jsonOutput" spellcheck="false" placeholder="Formatted JSON appears here"></textarea></div></div><div class="toolbar">${btn('jsonFormat','Pretty print','btn primary')}${btn('jsonMinify','Minify')}${btn('jsonValidate','Validate')}${btn('jsonCopy','Copy output')}${btn('jsonClear','Clear','btn ghost danger')}<span class="spacer status" id="jsonStatus">Ready</span></div></div>`)}
function wireJson(){const i=$('#jsonInput'),o=$('#jsonOutput'),s=$('#jsonStatus');$('#jsonFormat').onclick=()=>{try{const v=JSON.parse(i.value);o.value=JSON.stringify(v,null,2);s.textContent='Valid JSON';s.className='status good'}catch(e){s.textContent='Invalid JSON: '+e.message;s.className='status bad'}};$('#jsonMinify').onclick=()=>{try{o.value=JSON.stringify(JSON.parse(i.value));s.textContent='Minified';s.className='status good'}catch(e){s.textContent='Invalid JSON: '+e.message;s.className='status bad'}};$('#jsonValidate').onclick=()=>{try{JSON.parse(i.value);s.textContent='Valid JSON';s.className='status good'}catch(e){s.textContent='Invalid JSON: '+e.message;s.className='status bad'}};$('#jsonCopy').onclick=()=>copyText(o.value);$('#jsonClear').onclick=()=>{i.value='';o.value='';s.textContent='Ready';s.className='status'};}
function decodeJwtPart(part){part=part.replace(/-/g,'+').replace(/_/g,'/');part+='='.repeat((4-part.length%4)%4);const bin=atob(part);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
function fmtClaim(k,v){if(typeof v!=='number'||!['iat','exp','nbf','auth_time','updated_at','created_at'].includes(k))return esc(typeof v==='object'?JSON.stringify(v):String(v));const d=new Date(v*1000);return `${esc(String(v))}  →  ${esc(Number.isNaN(d.getTime())?'Invalid date':d.toLocaleString())}`}
function jwtView(){return toolShell(toolById('jwt'),`<div class="stack"><div class="field"><label>JWT</label><textarea id="jwtInput" spellcheck="false" style="min-height:180px" placeholder="eyJhbGciOi...header.payload.signature"></textarea></div><div id="jwtNotice" class="note">Decoding is local. This does <strong>not</strong> verify the JWT signature or prove token authenticity.</div><div id="jwtResult" class="empty"><div><strong>Paste a token to inspect it</strong><span>Header and payload are decoded locally; the signature is never verified.</span></div></div></div>`)}
function wireJwt(){const input=$('#jwtInput'),out=$('#jwtResult');const run=()=>{const token=input.value.trim();if(!token){out.className='empty';out.innerHTML='<div><strong>Paste a token to inspect it</strong><span>Header and payload are decoded locally.</span></div>';return}try{const p=token.split('.');if(p.length!==3)throw new Error('A JWT should contain 3 dot-separated parts.');const h=decodeJwtPart(p[0]),pl=decodeJwtPart(p[1]);const rows=Object.keys(pl).sort().map(k=>`<tr><th><span class="claim-key">${esc(k)}</span></th><td class="claim-value">${fmtClaim(k,pl[k])}</td></tr>`).join('');const exp=typeof pl.exp==='number'?pl.exp*1000:null;let status='No exp claim';if(exp!==null)status=Date.now()>=exp?'<span class="danger">Appears expired</span>':'<span class="success">Appears active</span>';out.className='stack';out.innerHTML=`<div class="chips"><span class="chip">alg <strong>${esc(h.alg||'—')}</strong></span><span class="chip">typ <strong>${esc(h.typ||'—')}</strong></span><span class="chip">status <strong>${status}</strong></span></div><div class="grid-2"><div><div class="section-label">Header</div><div class="output">${esc(JSON.stringify(h,null,2))}</div></div><div><div class="section-label">Payload</div><div style="max-height:330px;overflow:auto;border:1px solid var(--border);border-radius:9px"><table class="table">${rows||'<tr><td>No claims</td></tr>'}</table></div></div></div><div class="note">JWT decoding only base64url-decodes the token. The signature is not checked, so the displayed claims are untrusted input.</div>`}catch(e){out.className='alert';out.textContent='Invalid JWT: '+e.message}};input.addEventListener('input',run)}
function uuidView(){return toolShell(toolById('uuid'),`<div class="stack"><div class="grid-3"><div class="field"><label>Count</label><input id="uuidCount" type="number" min="1" max="500" value="10"></div><div class="field"><label>Format</label><select disabled><option>UUID v4</option></select></div><div class="field"><label>&nbsp;</label>${btn('uuidGenerate','Generate','btn primary')}</div></div><div class="field"><label>Output</label><textarea id="uuidOutput" spellcheck="false" style="min-height:300px" placeholder="Generated UUIDs appear here"></textarea></div><div class="toolbar">${btn('uuidCopy','Copy all')}${btn('uuidClear','Clear','btn ghost danger')}</div></div>`)}
function wireUuid(){const o=$('#uuidOutput'),c=$('#uuidCount');$('#uuidGenerate').onclick=()=>{const n=Math.min(500,Math.max(1,Number(c.value)||1));const list=[];for(let i=0;i<n;i++)list.push(crypto.randomUUID?crypto.randomUUID():fallbackUUID());o.value=list.join('\n')};$('#uuidCopy').onclick=()=>copyText(o.value);$('#uuidClear').onclick=()=>o.value='';function fallbackUUID(){const a=crypto.getRandomValues(new Uint8Array(16));a[6]=(a[6]&15)|64;a[8]=(a[8]&63)|128;const s=[...a].map(x=>x.toString(16).padStart(2,'0'));return s.slice(0,4).join('')+'-'+s.slice(4,6).join('')+'-'+s.slice(6,8).join('')+'-'+s.slice(8,10).join('')+'-'+s.slice(10).join('')}}
function timeView(){return toolShell(toolById('time'),`<div class="stack"><div class="grid-2"><div class="field"><label>Unix timestamp</label><div class="toolbar"><input id="tsInput" class="mono" placeholder="1720000000"><select id="tsUnit"><option value="s">seconds</option><option value="ms">milliseconds</option></select></div></div><div class="field"><label>Date/time input</label><input id="dateInput" type="datetime-local" step="1"></div></div><div class="toolbar">${btn('tsNow','Use now','btn ghost')}${btn('tsFromUnix','Timestamp → date','btn primary')}${btn('tsFromDate','Date → timestamp')}${btn('tsSwap','Swap direction')}</div><div id="tsOutput" class="output">Enter a value above.</div></div>`)}
function wireTime(){const t=$('#tsInput'),u=$('#tsUnit'),d=$('#dateInput'),o=$('#tsOutput');function renderDate(ms){const dt=new Date(ms);if(Number.isNaN(dt.getTime()))throw new Error('Invalid timestamp');o.innerHTML=`Local: ${esc(dt.toLocaleString())}\nUTC:   ${esc(dt.toUTCString())}\nISO:   ${esc(dt.toISOString())}\nUnix seconds: ${Math.floor(ms/1000)}\nUnix ms:      ${ms}`}function unix(){const n=Number(t.value);if(!Number.isFinite(n))throw new Error('Invalid number');renderDate(u.value==='s'?n*1000:n)}function date(){const ms=new Date(d.value).getTime();if(Number.isNaN(ms))throw new Error('Invalid date');o.textContent=`Unix seconds: ${Math.floor(ms/1000)}\nUnix ms: ${ms}`;t.value=u.value==='s'?Math.floor(ms/1000):ms}$('#tsNow').onclick=()=>{const now=Date.now();t.value=u.value==='s'?Math.floor(now/1000):now;d.value=new Date(now-new Date().getTimezoneOffset()*60000).toISOString().slice(0,19)};$('#tsFromUnix').onclick=()=>{try{unix()}catch(e){o.textContent=e.message}};$('#tsFromDate').onclick=()=>{try{date()}catch(e){o.textContent=e.message}};$('#tsSwap').onclick=()=>{const v=t.value;t.value='';t.placeholder=d.value?'':'';d.value='';o.textContent='Direction swapped; choose an input.'}}
function b64Encode(s){const bytes=new TextEncoder().encode(s);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
function b64Decode(s){const clean=s.replace(/\s/g,'');if(!/^[A-Za-z0-9+/]*={0,2}$/.test(clean)||clean.length%4===1)throw new Error('Malformed Base64 input.');const bin=atob(clean);return new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function base64View(){return toolShell(toolById('base64'),`<div class="stack"><div class="dual"><div class="field"><label>Input</label><textarea id="b64Input" spellcheck="false" placeholder="Text or Base64"></textarea></div><button class="icon-btn swap" id="b64Swap">↔</button><div class="field"><label>Output</label><textarea id="b64Output" spellcheck="false"></textarea></div></div><div class="toolbar">${btn('b64Encode','Encode','btn primary')}${btn('b64Decode','Decode')}${btn('b64Copy','Copy output')}${btn('b64Clear','Clear','btn ghost danger')}<span class="spacer status" id="b64Status">UTF-8 safe</span></div></div>`)}

function urlView(){return toolShell(toolById('url'),`<div class="stack"><div class="dual"><div class="field"><label>URL</label><textarea id="urlInput" spellcheck="false" style="min-height:180px" placeholder="https://example.com:8080/path?q=hello&lang=en#section"></textarea></div><button class="icon-btn swap" id="urlSwap">↔</button><div class="field"><label>Encoded / decoded text</label><textarea id="urlEncodeInput" spellcheck="false" style="min-height:180px"></textarea></div></div><div class="toolbar">${btn('urlParse','Parse URL','btn primary')}${btn('urlEncode','Encode')}${btn('urlDecode','Decode')}${btn('urlCopy','Copy parsed')}${btn('urlClear','Clear','btn ghost danger')}</div><div id="urlResult" class="stack"></div></div>`)}

function smartDetect(value){
  const v=value.trim();
  if(!v)return null;
  if(/^\s*[\[{]/.test(v)){
    try{JSON.parse(v);return {id:'json',reason:'Looks like valid JSON'}}
    catch(e){if(/^\s*[\[{]/.test(v))return {id:'json',reason:'Looks like JSON'}}
  }
  if(/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(v))return {id:'jwt',reason:'Looks like a JWT'};
  if(/^(?:\d{10}|\d{13})$/.test(v))return {id:'time',reason:'Looks like a Unix timestamp'};
  if(/^(?:https?:\/\/|ftp:\/\/)/i.test(v))return {id:'url',reason:'Looks like a URL'};
  if(/^(?:[A-Za-z0-9+/]{8,}={0,2})$/.test(v)&&v.length%4===0)return {id:'base64',reason:'Looks like Base64'};
  return null;
}

function showSuggestion(el){const hit=smartDetect(el.value);if(!hit)return;let holder=document.getElementById('smartPaste');if(!holder){holder=document.createElement('div');holder.id='smartPaste';document.querySelector('.content').prepend(holder)}holder.className='suggestion';const t=toolById(hit.id);holder.innerHTML=`<div class="tool-icon">${t.icon}</div><div class="suggestion-text"><strong>Detected ${esc(t.name)}</strong><div class="muted">${esc(hit.reason)} — choose where to send it.</div></div><button class="btn primary" id="suggestOpen">Open tool</button><button class="btn ghost" id="suggestDismiss">Dismiss</button>`;$('#suggestOpen').onclick=()=>{const value=el.value;openView(hit.id);const target=[$('textarea'),$('input')].find(x=>x&&x.id.toLowerCase().includes(hit.id));if(target)target.value=value;};$('#suggestDismiss').onclick=()=>holder.remove();}
function paletteItems(q){const n=q.trim().toLowerCase();const list=tools.filter(t=>!n||`${t.name} ${t.desc} ${t.cat} ${t.keys}`.toLowerCase().includes(n));return list.map(t=>`<button class="palette-item" data-palette="${t.id}"><span class="tool-icon">${t.icon}</span><span><strong>${esc(t.name)}</strong><small class="muted"> ${esc(t.cat)}</small></span><span class="palette-k">Enter</span></button>`).join('')||'<div class="empty" style="min-height:120px"><div><strong>No matches</strong><span>Try another search term.</span></div></div>'}
function openPalette(){const p=$('#palette'),i=$('#paletteInput');p.classList.add('open');i.value='';$('#paletteList').innerHTML=paletteItems('');i.focus()}function closePalette(){$('#palette').classList.remove('open')}
$('#paletteBtn').onclick=openPalette;$('#palette').addEventListener('click',e=>{if(e.target===e.currentTarget)closePalette()});$('#paletteInput').addEventListener('input',e=>$('#paletteList').innerHTML=paletteItems(e.target.value));$('#paletteList').addEventListener('click',e=>{const b=e.target.closest('[data-palette]');if(b){openView(b.dataset.palette);closePalette()}});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}if(e.key==='Escape')closePalette()});$('#themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';persist();setTheme()};$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.deferredPrompt=e;$('#installBtn').hidden=false});$('#installBtn').onclick=async()=>{if(!window.deferredPrompt)return;window.deferredPrompt.prompt();await window.deferredPrompt.userChoice;window.deferredPrompt=null;$('#installBtn').hidden=true};
function wireActive(){const id=state.active;if(id==='json')wireJson();if(id==='jwt')wireJwt();if(id==='uuid')wireUuid();if(id==='time')wireTime();if(id==='base64')wireBase64();if(id==='url')wireUrl();if(id==='regex')wireRegex();if(id==='qr')wireQr();if(id==='text')wireText();if(id==='hash')wireHash();}
const oldOpen=openView;openView=function(id){oldOpen(id);wireActive()};
function initCardGlow(){
  let raf=0,lastTarget=null,lastX=0,lastY=0;
  const update=()=>{
    raf=0;
    const el=lastTarget;
    if(!el)return;
    const r=el.getBoundingClientRect();
    el.style.setProperty('--gx',((lastX-r.left)/Math.max(1,r.width)*100).toFixed(2)+'%');
    el.style.setProperty('--gy',((lastY-r.top)/Math.max(1,r.height)*100).toFixed(2)+'%');
    el.classList.add('glow-active');
  };
  document.addEventListener('pointermove',e=>{
    const el=e.target.closest?.('.tool-card,.home-tool');
    if(!el){
      if(lastTarget) lastTarget.classList.remove('glow-active');
      lastTarget=null;
      return;
    }
    lastTarget=el; lastX=e.clientX; lastY=e.clientY;
    if(!raf)raf=requestAnimationFrame(update);
  });
  document.addEventListener('pointerout',e=>{
    const from=e.target.closest?.('.tool-card,.home-tool');
    const to=e.relatedTarget?.closest?.('.tool-card,.home-tool');
    if(from && from!==to){from.classList.remove('glow-active');from.style.removeProperty('--gx');from.style.removeProperty('--gy');}
  });
}
initCardGlow();
setTheme();renderSidebar();renderHome();wireSmartPaste();
})();
</script>
